[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warthunderrpc-plus"
version = "1.0.0"
description = "Discord Rich Presence for War Thunder, with live Mach number, airspeed and dogfight detection"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Chawannua", email = "chawannua@gmail.com" }]
requires-python = ">=3.11"
keywords = ["warthunder", "discord", "rich-presence", "telemetry"]
dependencies = [
    "pypresence>=4.3.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "imagehash>=4.3.1", "pyinstaller>=6.0.0"]
# The weapon HUD reader; also needs the Tesseract binary, which pip cannot install.
ocr = ["pytesseract>=0.3.10"]

[project.scripts]
warthunderrpc-plus = "wtrpc.__main__:main"

[project.urls]
Homepage = "https://github.com/chawannua/WarThunderRPC-Plus"
Issues = "https://github.com/chawannua/WarThunderRPC-Plus/issues"

[tool.setuptools.packages.find]
include = ["wtrpc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
